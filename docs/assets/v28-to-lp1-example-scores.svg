<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 980 545">

    <style>
      :root { --bg:#ffffff; --fg:#172033; --muted:#60708a; --grid:#d7deea;
              --v28:#2563eb; --lp1:#d97706; --positive:#047857; --negative:#b91c1c; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#111827; --fg:#f3f4f6; --muted:#b3bfd1; --grid:#374151;
                --v28:#60a5fa; --lp1:#fbbf24; --positive:#34d399; --negative:#f87171; }
      }
      .bg { fill:var(--bg); } .fg { fill:var(--fg); } .muted { fill:var(--muted); }
      .grid { stroke:var(--grid); stroke-width:1; } .v28 { fill:var(--v28); stroke:var(--v28); }
      .lp1 { fill:var(--lp1); stroke:var(--lp1); } .positive { fill:var(--positive); }
      .negative { fill:var(--negative); } text { font-family:system-ui,-apple-system,sans-serif; }
      .title { font-size:20px; font-weight:600; } .subtitle { font-size:12px; }
      .label { font-size:12px; } .value { font-size:11px; font-variant-numeric:tabular-nums; }
      .axis { font-size:11px; fill:var(--muted); }
    </style>
    
<rect class="bg" width="980" height="545"/>
<title id="title">Representative V28 and LP1 scores</title>
<desc id="desc">Grouped horizontal bars compare risk scores for eight non-dual aged example profiles.</desc>
<text class="title fg" x="20" y="30">Representative scores: non-dual aged, male age 72</text>
<text class="subtitle muted" x="20" y="52">Same V28 HCCs; only scoring behavior changes</text>
<rect class="v28" x="285" y="62" width="12" height="12"/><text class="label fg" x="303" y="72">CMS V28</text>
<rect class="lp1" x="380" y="62" width="12" height="12"/><text class="label fg" x="398" y="72">LEAD LP1</text>
<line class="grid" x1="285.0" y1="80" x2="285.0" y2="510"/>
<text class="axis" text-anchor="middle" x="285.0" y="530">0.0</text>
<line class="grid" x1="417.0" y1="80" x2="417.0" y2="510"/>
<text class="axis" text-anchor="middle" x="417.0" y="530">0.6</text>
<line class="grid" x1="549.0" y1="80" x2="549.0" y2="510"/>
<text class="axis" text-anchor="middle" x="549.0" y="530">1.2</text>
<line class="grid" x1="681.0" y1="80" x2="681.0" y2="510"/>
<text class="axis" text-anchor="middle" x="681.0" y="530">1.8</text>
<line class="grid" x1="813.0" y1="80" x2="813.0" y2="510"/>
<text class="axis" text-anchor="middle" x="813.0" y="530">2.4</text>
<line class="grid" x1="945.0" y1="80" x2="945.0" y2="510"/>
<text class="axis" text-anchor="middle" x="945.0" y="530">3.0</text>
<text class="label fg" x="275" y="107" text-anchor="end">No payment HCCs</text>
<rect class="v28" x="285" y="93" width="86.9" height="13" opacity="0.88"/>
<text class="value fg" x="376.9" y="104">0.396</text>
<rect class="lp1" x="285" y="112" width="141.7" height="13" opacity="0.88"/>
<text class="value fg" x="431.7" y="123">0.646</text>
